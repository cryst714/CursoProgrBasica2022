<!DOCTYPE html>
<html>
    <head>
        <meta charset='utf-8' />
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <title>Piedra, papel o tijera </title>
        <link rel='stylesheet' href='main.css'>
        <script>
            //1 es piedra, 2 es papel 3 tijera
            
            //CON FUNCION 
            function aleatorio(minimo, maximo){
                return Math.floor(Math.random()*(maximo-minimo+1) + minimo)
            }
            
            let jugador = 0
            //let min = 1
            // let max = 3
            //let pc = Math.floor(Math.random()*(max-min+1) + min)
            let pc = aleatorio(1,3)
            //let pc =  3
            jugador = prompt( "EL JUGADOR debe escoger: 1 piedra, 2 papel, 3 tiejera")


            //alert("elegiste : " + jugador)
            //emojis en visual studio Windows + . (punto) Mac : Control + Command + Space
            if (jugador == 1 ) {
                alert("elegiste : 🪨🪨")
            } else  if (jugador == 2){
                alert("elegiste : 📄🗞️")
            }else 
            if (jugador == 3){
                alert("elegiste : ✂️✂️")
            }
            else{
                alert("elegiste perder")
            }
            //pc = prompt( "LA PC debe escoger: 1 piedra, 2 papel, 3 tiejera" + p)
            alert("pc escogio " + pc)
            
            if (pc == 1 ) {
                alert("PC elegiO : 🪨🪨")
            } else  if (pc == 2){
                alert("PC elegiO : 📄🗞️")
            }else 
            if (pc == 3){
                alert("PC elegiO : ✂️✂️")
            }
            else{
                alert("elegiste perder")
            }

            //combate
            if (pc == jugador){
                alert("empate")
            } else 
            if (jugador == 1 && pc == 3) {
                alert("ganaste")
            }else 
            if (jugador == 2 && pc == 1) {
                alert("ganaste")
            }else 
            if (jugador == 3 && pc == 2) {
                alert("ganaste")
            }else 
            {
                alert("perdiste")
            }
        </script>
    </head>
    <body>
        <h1>Piedra, papel o tijera</h1>
    </body>
</html>
